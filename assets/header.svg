<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Hryhorii Yershov — MentTea</title>
  <desc id="desc">Senior Software Engineer from Cologne, Germany. Java 25, Spring Boot, Microservices, Kafka, Kubernetes, AI/LLM, PostgreSQL, Docker, React, TypeScript, AWS/Azure, Terraform. A cup of coffee with code steam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100c"/>
      <stop offset="0.55" stop-color="#0b1813"/>
      <stop offset="1" stop-color="#0f231b"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ff5c9"/>
      <stop offset="0.5" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#22b8a6"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173528"/>
      <stop offset="1" stop-color="#0c1b15"/>
    </linearGradient>
    <radialGradient id="coffee" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#9a5b2c"/>
      <stop offset="0.7" stop-color="#5a2f14"/>
      <stop offset="1" stop-color="#c48a52"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#3ddc97" opacity="0.09"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="440" rx="28"/></clipPath>
    <clipPath id="cupClip">
      <path d="M820 200 H1040 C1040 272 1008 322 930 322 C852 322 820 272 820 200 Z"/>
    </clipPath>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; }

    .orb   { animation: pulse 9s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .orb.b { animation-delay: -4.5s; }
    @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }

    .rise  { animation: rise 1s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s } .d2 { animation-delay: .25s } .d3 { animation-delay: .4s }
    .d4 { animation-delay: .55s } .d5 { animation-delay: .7s } .d6 { animation-delay: .85s }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

    .steam { fill: none; stroke: #9ff5c9; stroke-width: 5; stroke-linecap: round;
             stroke-dasharray: 26 200; animation: steam 3.6s ease-in-out infinite; opacity: 0; }
    .s2 { animation-delay: 1.2s } .s3 { animation-delay: 2.4s }
    @keyframes steam {
      0%   { stroke-dashoffset: 0;    opacity: 0; transform: translateY(8px); }
      25%  { opacity: .75; }
      100% { stroke-dashoffset: -150; opacity: 0; transform: translateY(-18px); }
    }

    .glyph { fill: #9ff5c9; font-size: 22px; opacity: 0; animation: float 6s ease-in infinite; }
    .g2 { animation-delay: 1.5s } .g3 { animation-delay: 3s } .g4 { animation-delay: 4.5s }
    @keyframes float {
      0%   { opacity: 0;  transform: translateY(0); }
      20%  { opacity: .8; }
      100% { opacity: 0;  transform: translateY(-120px); }
    }


    .ripple { animation: ripple 3s ease-in-out infinite; transform-origin: 930px 200px; }
    @keyframes ripple { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(.96); } }

    .shine { animation: shine 6s ease-in-out infinite; }
    @keyframes shine { 0%,60% { transform: translateX(-260px); } 100% { transform: translateX(260px); } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#dots)"/>
    <circle class="orb"   cx="930" cy="190" r="170" fill="#3ddc97" opacity=".55" filter="url(#blur)"/>
    <circle class="orb b" cx="120" cy="460" r="160" fill="#22b8a6" opacity=".45" filter="url(#blur)"/>
    <circle class="orb b" cx="600" cy="-40" r="120" fill="#3ddc97" opacity=".25" filter="url(#blur)"/>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="438.5" rx="27.5" fill="none" stroke="#3ddc97" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- ─── left: intro ─── -->
  <g class="mono rise d1">
    <text x="80" y="104" font-size="17" fill="#3ddc97">~/menttea <tspan fill="#5f8a76">$</tspan> <tspan fill="#c7e6d6">./brew --profile</tspan></text>
  </g>
  <g class="sans rise d2">
    <text x="78" y="176" font-size="62" font-weight="800" fill="#eafaf2" letter-spacing="-1">Hryhorii Yershov</text>
  </g>
  <g class="sans rise d3">
    <text x="80" y="226" font-size="30" font-weight="600"><tspan fill="#9ff5c9">Senior </tspan><tspan fill="#3ddc97">Software </tspan><tspan fill="#2fcaa0">Engineer</tspan></text>
    <text x="470" y="226" font-size="18" font-weight="500" fill="#7fa894">· 6+ yrs · Cologne, DE</text>
  </g>

  <g class="sans rise d4" font-size="15" font-weight="600" text-anchor="middle">
    <rect x="80" y="250" width="86" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="123" y="271" fill="#9ff5c9">Java 25</text>
    <rect x="176" y="250" width="120" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="236" y="271" fill="#9ff5c9">Spring Boot</text>
    <rect x="306" y="250" width="136" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="374" y="271" fill="#9ff5c9">Microservices</text>
    <rect x="452" y="250" width="74" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="489" y="271" fill="#9ff5c9">Kafka</text>
    <rect x="536" y="250" width="114" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="593" y="271" fill="#9ff5c9">Kubernetes</text>
    <rect x="660" y="250" width="98" height="32" rx="16" fill="#f2b84b" fill-opacity=".10" stroke="#f2b84b" stroke-opacity=".45"/>
    <text x="709" y="271" fill="#f6cf7d">AI · LLM</text>
    <rect x="80" y="292" width="112" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="136" y="313" fill="#9ff5c9">PostgreSQL</text>
    <rect x="202" y="292" width="82" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="243" y="313" fill="#9ff5c9">Docker</text>
    <rect x="294" y="292" width="76" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="332" y="313" fill="#9ff5c9">React</text>
    <rect x="380" y="292" width="110" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="435" y="313" fill="#9ff5c9">TypeScript</text>
    <rect x="500" y="292" width="116" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="558" y="313" fill="#9ff5c9">AWS · Azure</text>
    <rect x="626" y="292" width="104" height="32" rx="16" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".45"/>
    <text x="678" y="313" fill="#9ff5c9">Terraform</text>
  </g>

  <g class="mono rise d5" font-size="19">
    <rect x="80" y="346" width="526" height="46" rx="12" fill="#050c09" fill-opacity=".7" stroke="#1f3a2e"/>
    <text x="100" y="375"><tspan fill="#c792ea">while</tspan><tspan fill="#c7e6d6"> (!</tspan><tspan fill="#82aaff">me</tspan><tspan fill="#c7e6d6">.</tspan><tspan fill="#3ddc97">isSleeping</tspan><tspan fill="#c7e6d6">()) { </tspan><tspan fill="#82aaff">me</tspan><tspan fill="#c7e6d6">.</tspan><tspan fill="#3ddc97">coding</tspan><tspan fill="#c7e6d6">(); }</tspan></text>
    <rect class="cursor" x="578" y="358" width="10" height="22" rx="2" fill="#3ddc97"/>
  </g>

  <!-- ─── right: the cup ─── -->
  <g transform="translate(0 30)">
  <g class="rise d3">
    <!-- steam -->
    <path class="steam"    d="M890 180 C870 150 910 130 890 100 C875 78 900 60 890 40"/>
    <path class="steam s2" d="M930 180 C910 148 950 128 930 96 C915 72 942 56 930 34"/>
    <path class="steam s3" d="M970 180 C950 150 990 130 970 100 C955 78 980 60 970 40"/>
    <g class="mono">
      <text class="glyph"    x="858" y="150">{</text>
      <text class="glyph g2" x="992" y="150">}</text>
      <text class="glyph g3" x="920" y="140">;</text>
      <text class="glyph g4" x="954" y="160">()</text>
    </g>

    <!-- saucer -->
    <ellipse cx="930" cy="330" rx="158" ry="22" fill="#0a1611" stroke="#3ddc97" stroke-opacity=".35" stroke-width="2"/>
    <ellipse cx="930" cy="326" rx="104" ry="11" fill="#050c09" opacity=".7"/>

    <!-- handle -->
    <path d="M1036 218 C1100 214 1102 296 1018 298" fill="none" stroke="#173528" stroke-width="18" stroke-linecap="round"/>
    <path d="M1036 218 C1100 214 1102 296 1018 298" fill="none" stroke="#3ddc97" stroke-opacity=".55" stroke-width="2"/>

    <!-- body -->
    <path d="M820 200 H1040 C1040 272 1008 322 930 322 C852 322 820 272 820 200 Z" fill="url(#cup)" stroke="#3ddc97" stroke-opacity=".7" stroke-width="2"/>
    <g clip-path="url(#cupClip)">
      <rect class="shine" x="800" y="190" width="120" height="140" fill="url(#shine)" transform="skewX(-12)"/>
    </g>

    <!-- coffee bean on the cup -->
    <g transform="translate(930 264) rotate(-30)" filter="url(#glow)">
      <ellipse rx="22" ry="31" fill="#f2b84b"/>
      <path d="M2 -27 C-12 -12 12 10 -2 27" fill="none" stroke="#0c1b15" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- coffee surface with latte art -->
    <g class="ripple">
      <ellipse cx="930" cy="200" rx="110" ry="17" fill="url(#coffee)"/>
      <path d="M930 210 C900 200 896 190 914 189 C922 189 928 193 930 196 C932 193 938 189 946 189 C964 190 960 200 930 210 Z" fill="#f3dfc4" opacity=".9"/>
      <ellipse cx="896" cy="196" rx="26" ry="3" fill="#ffffff" opacity=".15"/>
    </g>
    <ellipse cx="930" cy="200" rx="110" ry="17" fill="none" stroke="#d9a066" stroke-width="2"/>

  </g>
  </g>
</svg>
