<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="t d">
  <title id="t">Document Processing Platform</title>
  <desc id="d">Automated extraction, validation and normalisation of structured data from PDFs and scanned documents, end to end. Tech: Spring Boot, FastAPI, Document AI, Tesseract OCR.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2019"/><stop offset="1" stop-color="#08110d"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff5c9"/><stop offset="1" stop-color="#22b8a6"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset=".5" stop-color="#9ff5c9"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".16"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="480" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .chip { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #9ff5c9; }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-480px); } 60%,100% { transform: translateX(480px); } }
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="250" fill="url(#bg)"/>
    <rect width="480" height="250" fill="url(#glow)"/>
    <rect class="sweep" width="480" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".75" y=".75" width="478.5" height="248.5" rx="17.5" fill="none" stroke="#1f3a2e" stroke-width="1.5"/>

  <rect x="28" y="28" width="48" height="48" rx="13" fill="url(#tile)"/>
  <path transform="translate(38 38)" d="M6 2h9l5 5v15H6z M15 2v5h5 M9 12h8 M9 16h8 M9 20h5" fill="none" stroke="#0b1813" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="38" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#f2b84b">ESTEM · MVP</text>
  <text x="92" y="61" class="sans" font-size="21" font-weight="700" fill="#eafaf2">Document Processing Platform</text>
  <text x="92" y="80" class="sans" font-size="13.5" fill="#7fa894">Distributed · Document AI · OCR</text>

  <text x="28" y="120" class="sans" font-size="14.5" fill="#c7e6d6">Automated extraction, validation and normalisation of</text>
  <text x="28" y="142" class="sans" font-size="14.5" fill="#c7e6d6">structured data from PDFs and scanned documents, end to</text>
  <text x="28" y="164" class="sans" font-size="14.5" fill="#c7e6d6">end.</text>

  <rect x="28" y="198" width="103" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="79.5" y="215.5" text-anchor="middle" class="chip">Spring Boot</text>
  <rect x="139" y="198" width="74" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="176" y="215.5" text-anchor="middle" class="chip">FastAPI</text>
  <rect x="221" y="198" width="103" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="272.5" y="215.5" text-anchor="middle" class="chip">Document AI</text>
  <rect x="332" y="198" width="118" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="391" y="215.5" text-anchor="middle" class="chip">Tesseract OCR</text>
</svg>
