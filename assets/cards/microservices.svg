<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="t d">
  <title id="t">Legacy → Microservices</title>
  <desc id="d">Re-engineered legacy applications into microservices on Apache Camel with new REST APIs, defining service boundaries and contracts. Tech: Apache Camel, OpenAPI, RabbitMQ, Helm, K8s.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2019"/><stop offset="1" stop-color="#08110d"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff5c9"/><stop offset="1" stop-color="#22b8a6"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset=".5" stop-color="#9ff5c9"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".16"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="480" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .chip { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #9ff5c9; }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-480px); } 60%,100% { transform: translateX(480px); } }
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="250" fill="url(#bg)"/>
    <rect width="480" height="250" fill="url(#glow)"/>
    <rect class="sweep" width="480" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".75" y=".75" width="478.5" height="248.5" rx="17.5" fill="none" stroke="#1f3a2e" stroke-width="1.5"/>

  <rect x="28" y="28" width="48" height="48" rx="13" fill="url(#tile)"/>
  <path transform="translate(38 38)" d="M9.5 2.5h5v5h-5z M2.5 16.5h5v5h-5z M16.5 16.5h5v5h-5z M12 7.5v4.5 M5 16.5V12h14v4.5" fill="none" stroke="#0b1813" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="38" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#f2b84b">ESTEM · ARCHITECTURE</text>
  <text x="92" y="61" class="sans" font-size="21" font-weight="700" fill="#eafaf2">Legacy → Microservices</text>
  <text x="92" y="80" class="sans" font-size="13.5" fill="#7fa894">Service boundaries · integration contracts</text>

  <text x="28" y="120" class="sans" font-size="14.5" fill="#c7e6d6">Re-engineered legacy applications into microservices on</text>
  <text x="28" y="142" class="sans" font-size="14.5" fill="#c7e6d6">Apache Camel with new REST APIs, defining service</text>
  <text x="28" y="164" class="sans" font-size="14.5" fill="#c7e6d6">boundaries and contracts.</text>

  <rect x="28" y="198" width="111" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="83.5" y="215.5" text-anchor="middle" class="chip">Apache Camel</text>
  <rect x="147" y="198" width="74" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="184" y="215.5" text-anchor="middle" class="chip">OpenAPI</text>
  <rect x="229" y="198" width="81" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="269.5" y="215.5" text-anchor="middle" class="chip">RabbitMQ</text>
  <rect x="318" y="198" width="52" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="344" y="215.5" text-anchor="middle" class="chip">Helm</text>
  <rect x="378" y="198" width="44" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="400" y="215.5" text-anchor="middle" class="chip">K8s</text>
</svg>
