<svg xmlns="http://www.w3.org/2000/svg" width="480" height="250" viewBox="0 0 480 250" role="img" aria-labelledby="t d">
  <title id="t">DealRadar</title>
  <desc id="d">Define a search once in a guided Telegram dialog; the engine polls marketplaces, stores what is new and sends one digest per cycle. Tech: Spring Boot, PostgreSQL, Flyway, Telegram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f2019"/><stop offset="1" stop-color="#08110d"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9ff5c9"/><stop offset="1" stop-color="#22b8a6"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3ddc97" stop-opacity="0"/><stop offset=".5" stop-color="#9ff5c9"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#3ddc97" stop-opacity=".16"/><stop offset="1" stop-color="#3ddc97" stop-opacity="0"/></radialGradient>
    <clipPath id="c"><rect width="480" height="250" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .chip { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, Menlo, monospace; font-size: 12px; font-weight: 600; fill: #9ff5c9; }
    .sweep { animation: sweep 5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-480px); } 60%,100% { transform: translateX(480px); } }
  </style>
  <g clip-path="url(#c)">
    <rect width="480" height="250" fill="url(#bg)"/>
    <rect width="480" height="250" fill="url(#glow)"/>
    <rect class="sweep" width="480" height="2" fill="url(#edge)"/>
  </g>
  <rect x=".75" y=".75" width="478.5" height="248.5" rx="17.5" fill="none" stroke="#1f3a2e" stroke-width="1.5"/>

  <rect x="28" y="28" width="48" height="48" rx="13" fill="url(#tile)"/>
  <path transform="translate(38 38)" d="M12 3a9 9 0 1 0 9 9 M12 7a5 5 0 1 0 5 5 M12 12l7-7 M12 12h.01" fill="none" stroke="#0b1813" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="92" y="38" class="sans" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#f2b84b">PET PROJECT</text>
  <text x="92" y="61" class="sans" font-size="21" font-weight="700" fill="#eafaf2">DealRadar</text>
  <text x="92" y="80" class="sans" font-size="13.5" fill="#7fa894">Marketplace watcher → Telegram</text>

  <text x="28" y="120" class="sans" font-size="14.5" fill="#c7e6d6">Define a search once in a guided Telegram dialog; the</text>
  <text x="28" y="142" class="sans" font-size="14.5" fill="#c7e6d6">engine polls marketplaces, stores what is new and sends</text>
  <text x="28" y="164" class="sans" font-size="14.5" fill="#c7e6d6">one digest per cycle.</text>

  <rect x="28" y="198" width="103" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="79.5" y="215.5" text-anchor="middle" class="chip">Spring Boot</text>
  <rect x="139" y="198" width="96" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="187" y="215.5" text-anchor="middle" class="chip">PostgreSQL</text>
  <rect x="243" y="198" width="66" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="276" y="215.5" text-anchor="middle" class="chip">Flyway</text>
  <rect x="317" y="198" width="81" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="357.5" y="215.5" text-anchor="middle" class="chip">Telegram</text>
</svg>
