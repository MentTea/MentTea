  <rect x="139" y="198" width="111" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="194.5" y="215.5" text-anchor="middle" class="chip">Apache Camel</text>
  <rect x="258" y="198" width="81" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="298.5" y="215.5" text-anchor="middle" class="chip">Keycloak</text>
  <rect x="347" y="198" width="96" height="26" rx="13" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".35"/><text x="395" y="215.5" text-anchor="middle" class="chip">PostgreSQL</text>
