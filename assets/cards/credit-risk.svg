  <text x="92" y="61" class="sans" font-size="21" font-weight="700" fill="#eafaf2">Credit Risk &amp; Scoring</text>
  <text x="92" y="80" class="sans" font-size="13.5" fill="#7fa894">Regulated · third-party integrations</text>

  <text x="28" y="120" class="sans" font-size="14.5" fill="#c7e6d6">Consumer credit risk assessment wired to credit bureaus,</text>
  <text x="28" y="142" class="sans" font-size="14.5" fill="#c7e6d6">fraud prevention and sanctions screening, plus a credit</text>
  <text x="28" y="164" class="sans" font-size="14.5" fill="#c7e6d6">management system with scoring.</text>

