<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="786" viewBox="0 0 1000 786" role="img" aria-labelledby="title desc">
  <title id="title">menttea@cologne — about me</title>
  <desc id="desc">Terminal: Hryhorii Yershov, Senior Software Engineer at estem GmbH, 6+ years, Cologne. Java 8–25, Spring Boot 2/3/4, WebFlux, Apache Camel, Kafka, RabbitMQ, PostgreSQL, MongoDB, React, Docker, Kubernetes, Terraform, Azure, AWS. Microsoft Certified Azure Solutions Architect Expert and Azure Administrator Associate. AI: OpenAI and Claude APIs, Claude Code, Document AI, OCR. Speaks English, German, Ukrainian, Russian. Fuelled by coffee.</desc>
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a15"/>
      <stop offset="1" stop-color="#08110d"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22b8a6"/>
      <stop offset="1" stop-color="#9ff5c9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0" r="0.8">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".18"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, monospace; font-size: 16px; white-space: pre; }
    .p  { fill: #3ddc97; font-weight: 700; }
    .pm { fill: #5f8a76; }
    .c  { fill: #eafaf2; }
    .o  { fill: #c7e6d6; }
    .k  { fill: #82aaff; }
    .s  { fill: #f6cf7d; }
    .v  { fill: #c7e6d6; }
    .m  { fill: #5f8a76; font-style: italic; }
    .ok { fill: #3ddc97; font-weight: 700; }

    .type { animation: type .7s steps(22) both; }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    .show { animation: show .35s ease-out both; }
    @keyframes show { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .fill { transform-box: fill-box; transform-origin: left; animation: fill 1.6s cubic-bezier(.6,.1,.3,1) both; }
    @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="998" height="784" rx="16" fill="url(#win)" stroke="#1f3a2e" stroke-width="2"/>
  <rect x="1" y="1" width="998" height="784" rx="16" fill="url(#glow)"/>

